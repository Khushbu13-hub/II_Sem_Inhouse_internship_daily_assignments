<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live User Directory</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">

    <h1 class="text-center mb-4 fw-bold">
        Live User Directory
    </h1>

    <div class="row mb-4">

        <div class="col-md-8 mb-2">

            <input
            type="text"
            id="search"
            class="form-control"
            placeholder="Search users...">

        </div>

        <div class="col-md-2 mb-2">

            <select id="sort" class="form-select">
                <option value="asc">A → Z</option>
                <option value="desc">Z → A</option>
            </select>

        </div>

        <div class="col-md-2 text-center">

            <span class="badge bg-primary fs-6 p-3">
                Users:
                <span id="count">0</span>
            </span>

        </div>

    </div>

    <!-- Loading -->

    <div id="loading" class="text-center my-5">

        <div class="spinner-border text-primary"></div>

        <p class="mt-3">Loading users...</p>

    </div>

    

    <div id="error" class="text-center d-none">

        <h4 class="text-danger">
            Failed to load users.
        </h4>

        <button class="btn btn-danger mt-3" id="retry">
            Retry
        </button>

    </div>

    

    <div class="row" id="userContainer"></div>

</div>

<script src="script.js"></script>

</body>
</html>
