<!DOCTYPE html>
<html>
<head>
    <title>College Admission Form</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: #3dafb8;
            transition: 0.4s;
        }

        /* Theme Toggle Button */
        .theme-btn{
            position: absolute;
            top: 20px;
            right: 20px;
            width: auto;
            padding: 10px 15px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .theme-btn:hover{
            background: #444;
        }

        .container{
            background: white;
            width: 450px;
            margin: 70px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgb(49, 239, 210);
            transition: 0.4s;
        }

        h2{
            text-align: center;
            color: #597c7a;
            margin-bottom: 20px;
        }

        label{
            font-weight: bold;
        }

        input,
        select,
        textarea{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: 0.3s;
        }

        .gender{
            margin-bottom: 15px;
        }

        .gender input{
            width: auto;
            margin-right: 5px;
        }

        .submit-btn{
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover{
            background: #0056b3;
        }

        /* Dark Mode */

        body.dark-mode{
            background: #121212;
            color: white;
        }

        body.dark-mode .container{
            background: #1f1f1f;
            color: white;
            box-shadow: 0px 5px 15px rgba(255,255,255,0.2);
        }

        body.dark-mode h2{
            color: #4fc3f7;
        }

        body.dark-mode input,
        body.dark-mode select,
        body.dark-mode textarea{
            background: #333;
            color: white;
            border: 1px solid #777;
        }

        body.dark-mode input::placeholder,
        body.dark-mode textarea::placeholder{
            color: #ccc;
        }

        body.dark-mode .submit-btn{
            background: #4fc3f7;
            color: black;
        }

        body.dark-mode .submit-btn:hover{
            background: #29b6f6;
        }
    </style>
</head>

<body>

    <!-- Theme Toggle Button -->
    <button class="theme-btn" id="themeToggle">🌙 Dark Mode</button>

    <div class="container">

        <h2>College Admission Form</h2>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" required>

            <label>Date of Birth</label>
            <input type="date" required>

            <label>Gender</label>
            <div class="gender">
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
                <input type="radio" name="gender"> Other
            </div>

            <label>Department</label>
            <select required>
                <option value="">Select Department</option>
                <option>CSE</option>
                <option>IT</option>
                <option>ECE</option>
                <option>Mechanical</option>
                <option>Civil</option>
            </select>

            <label>Address</label>
            <textarea placeholder="Enter your address"></textarea>

            <button type="submit" class="submit-btn">Apply Now</button>

        </form>

    </div>

    <script>
        const themeToggle = document.getElementById("themeToggle");

        themeToggle.addEventListener("click", function () {
            document.body.classList.toggle("dark-mode");

            if(document.body.classList.contains("dark-mode")){
                themeToggle.innerHTML = "☀️ Light Mode";
            }else{
                themeToggle.innerHTML = "🌙 Dark Mode";
            }
        });
    </script>

</body>
</html>
